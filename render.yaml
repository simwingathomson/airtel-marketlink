services:
  - type: web
    name: airtel-marketlink-api
    env: python
    buildCommand: pip install -r requirements-server.txt
    startCommand: flask --app wsgi:app seed-data && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
